<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pcGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="pcGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1526" />
      <stop offset="100%" stop-color="#080C16" />
    </linearGradient>
    <filter id="pcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#pcGrad1)" stroke-width="2" />

  <!-- Logo Mark -->
  <g filter="url(#pcGlow)">
    <!-- Vertical Pillar of the P -->
    <rect x="36" y="28" width="14" height="72" rx="7" fill="url(#pcGrad1)" />

    <!-- Upper loop of P forming aerodynamic shield -->
    <path d="M48 28 H76 C88.703 28 99 38.297 99 51 C99 63.703 88.703 74 76 74 H48 Z" fill="url(#pcGrad2)" />
    
    <!-- Cutout inner loop -->
    <path d="M50 40 H74 C80.075 40 85 44.925 85 51 C85 57.075 80.075 62 74 62 H50 Z" fill="#0E1526" />

    <!-- Central AI Diamond / Crafting Star -->
    <path d="M68 51 L72.5 44 L77 51 L72.5 58 Z" fill="#FFFFFF" />

    <!-- Radiant Cyan Energy Spark -->
    <path d="M96 20 L98 25 L103 27 L98 29 L96 34 L94 29 L89 27 L94 25 Z" fill="#38BDF8" />
  </g>
</svg>